<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI-IDM 页面浮层 — 外观预览</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #0f1218; color: #8b95a5; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 22px; padding: 40px; }
  h1 { font-size: 15px; font-weight: 600; color: #cfd6e2; letter-spacing: .3px; }
  .note { font-size: 12px; color: #6b7686; margin-top: -14px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card { width: 330px; background: #1f2430; color: #e8ecf3; border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden;
          border: 1px solid rgba(255,255,255,.08); font-size: 13px; line-height: 1.5; }
  .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }
  .done .dot { background: #16a34a; }
  .err .dot { background: #dc2626; }
  .title { font-weight: 600; font-size: 12px; }
  .close { margin-left: auto; color: #9aa4b2; font-size: 15px; }
  .name { padding: 0 12px; color: #cfd6e2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; margin: 9px 12px 0; background: rgba(255,255,255,.10); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#3b82f6,#22d3ee); }
  .done .fill { background: #16a34a; }
  .err .fill { background: #dc2626; }
  .meta { display: flex; justify-content: space-between; padding: 6px 12px 10px; color: #9aa4b2; font-size: 11.5px; }
</style>
</head>
<body>
  <h1>接管下载时，页面右下角会出现这个浮层</h1>
  <div class="note">不依赖系统通知；关掉通知也能看见</div>
  <div class="row">
    <div class="card">
      <div class="head"><span class="dot"></span><span class="title">AI-IDM 下载中</span><span class="close">×</span></div>
      <div class="name">CC-Switch-v4.0.17-Windows.msi</div>
      <div class="bar"><div class="fill" style="width:62%"></div></div>
      <div class="meta"><span>62.0%</span><span>1.8MB/s · 16.3MB</span></div>
    </div>
    <div class="card done">
      <div class="head"><span class="dot"></span><span class="title">AI-IDM 下载完成</span><span class="close">×</span></div>
      <div class="name">C:\Users\UserX\Downloads\CC-Switch-v4.0.17-Windows.msi</div>
      <div class="bar"><div class="fill" style="width:100%"></div></div>
      <div class="meta"><span>100%</span><span>16.3MB</span></div>
    </div>
    <div class="card err">
      <div class="head"><span class="dot"></span><span class="title">AI-IDM 下载失败</span><span class="close">×</span></div>
      <div class="name">HTTP 429 Too Many Requests</div>
      <div class="bar"><div class="fill" style="width:100%"></div></div>
      <div class="meta"><span></span><span></span></div>
    </div>
  </div>
</body>
</html>
